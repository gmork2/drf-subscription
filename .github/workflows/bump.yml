name: Bump version

on:
  workflow_dispatch:
    inputs:
      part:
        description: 'Semver bump type'
        required: true
        type: choice
        default: 'patch'
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump, commit, tag and push
        run: uv run python scripts/bump_version.py ${{ inputs.part }} --commit --tag --push

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        run: uv publish
