name: Publish

on:
  push:
    branches: [main, master]
    paths:
      - 'subscription/__init__.py'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Detect version change
        id: version
        run: |
          current="$(sed -n 's/^__version__ = "\([^"]*\)"/\1/p' subscription/__init__.py)"
          previous="$(git show HEAD~1:subscription/__init__.py 2>/dev/null | sed -n 's/^__version__ = "\([^"]*\)"/\1/p' || true)"
          echo "current=${current} previous=${previous}"
          if [ -n "${current}" ] && [ "${current}" != "${previous}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package
        if: steps.version.outputs.changed == 'true'
        run: uv build

      - name: Publish to PyPI
        if: steps.version.outputs.changed == 'true'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish

      - name: Create GitHub Release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(uv run python -c 'import subscription; print(subscription.__version__)')"
          TAG="v${VERSION}"
          if ! git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            git tag "${TAG}"
            git push origin "refs/tags/${TAG}"
          fi
          gh release create "${TAG}" --generate-notes --title "${TAG}" || echo "Release ${TAG} already exists"
